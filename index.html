<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inside My Rig · stairfamily21</title>
  <meta name="description" content="An interactive 3D look inside my PC. Blow it apart, spin every part 360°, and see the specs and what each piece is doing.">
  <meta name="theme-color" content="#07031a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Rig">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='8' y='8' width='48' height='48' rx='8' fill='%2305060a' stroke='%233de1ff' stroke-width='4'/><rect x='22' y='22' width='20' height='20' rx='3' fill='%233de1ff'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script src="stats.js"></script>
</head>
<body>
  <canvas id="scene" aria-label="Interactive 3D model of my PC"></canvas>

  <header class="brand">
    <a class="handle" href="https://github.com/stairfamily21-gif" target="_blank" rel="noopener">stairfamily21</a>
    <h1 class="glitch" data-text="Inside my rig">Inside my rig</h1>
    <p class="sub" id="sub">Ryzen 7 7800X3D · RTX 4070 SUPER</p>
  </header>

  <div class="controls">
    <button id="explode" class="btn primary" type="button">
      <span class="dot"></span><span class="txt">Explode</span>
    </button>
    <button id="reset" class="btn" type="button">Reset view</button>
  </div>

  <nav id="parts" class="parts" aria-label="Parts"></nav>

  <p class="hint" id="hint">Drag to orbit · Scroll to zoom · Click any part</p>

  <aside id="panel" class="panel" aria-hidden="true">
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
    <div id="panel-body"></div>
  </aside>

  <div id="tip" class="tip" hidden></div>
  <div id="flash" class="flash"></div>

  <div id="boot" class="boot">
    <pre id="boot-log"></pre>
  </div>

  <footer class="foot" id="foot"></footer>

  <noscript><p class="nojs">This page needs JavaScript to show the 3D model.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
